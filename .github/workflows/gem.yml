name: CI

on:
  push:
    branches: [ main ]
    tags: [ "v*" ]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test (ruby)
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-latest, macos-latest ]
        ruby: [ "3.2", "3.3", "3.4" ]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: oxidize-rb/actions/setup-ruby-and-rust@v1
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: true
          # sccache is unavailable for aarch64-apple-darwin via
          # cargo-binstall (fatal exit 94 on macos runners), and the
          # default tarball strategy emits benign cache-save warnings
          # on fresh keys. The build is small enough to skip caching.
          cargo-cache: false
      - name: Compile extension
        run: bundle exec rake compile
      - name: Run tests
        run: bundle exec rake test

  build-gems:
    # Build precompiled platform gems for every release. The ruby gem
    # (source) plus per-platform fat gems are attached to the GitHub
    # release, and pushed to RubyGems.org when the tag is stable.
    if: startsWith(github.ref, 'refs/tags/v')
    needs: test
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        platform:
          - aarch64-linux
          - x86_64-linux
          - arm64-darwin
          - x86_64-darwin
    steps:
      - uses: actions/checkout@v5
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.4"
      - name: Cross-compile ${{ matrix.platform }}
        run: |
          gem install rake-compiler-dock rake-compiler
          rake-compiler-dock \
            --platform ${{ matrix.platform }} \
            rake native:${{ matrix.platform }} gem
      - name: Upload gem artifact
        uses: actions/upload-artifact@v5
        with:
          name: gem-${{ matrix.platform }}
          path: pkg/*.gem

  build-source-gem:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.4"
      - run: gem build prql-rb.gemspec
      - uses: actions/upload-artifact@v5
        with:
          name: gem-ruby
          path: prql-rb-*.gem

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [ build-gems, build-source-gem ]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v5
        with:
          path: pkg
          merge-multiple: true
      - name: Attach gems to release
        uses: softprops/action-gh-release@v2
        with:
          files: pkg/*.gem

  publish:
    # Push to RubyGems.org is a separate manual step so a fresh release
    # can be reviewed on GitHub Releases first — RubyGems yanks are
    # permanent, so a bad gem should never be pushed.
    if: startsWith(github.ref, 'refs/tags/v')
    needs: release
    runs-on: ubuntu-latest
    environment: rubygems
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v5
        with:
          path: pkg
          merge-multiple: true
      - name: Push to RubyGems.org
        env:
          GEM_HOST_API_KEY: ${{ secrets.RUBYGEMS_API_KEY }}
        run: |
          mkdir -p ~/.gem
          echo ":rubygems_api_key: ${GEM_HOST_API_KEY}" > ~/.gem/credentials
          chmod 0600 ~/.gem/credentials
          gem push pkg/*.gem