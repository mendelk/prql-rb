name: CI

on:
  push:
    branches: [ main ]
    tags: [ "v*" ]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test (ruby)
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-latest, macos-latest ]
        ruby: [ "3.2", "3.3", "3.4" ]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: oxidize-rb/actions/setup-ruby-and-rust@v1
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: true
          # sccache is unavailable for aarch64-apple-darwin via
          # cargo-binstall (fatal exit 94 on macos runners), and the
          # default tarball strategy emits benign cache-save warnings
          # on fresh keys. The build is small enough to skip caching.
          cargo-cache: false
      - name: Compile extension
        run: bundle exec rake compile
      - name: Run tests
        run: bundle exec rake test

  build-gems:
    # Cross-compile precompiled platform gems via rb-sys-dock
    # (same images/conventions as wasmtime-rb).
    if: startsWith(github.ref, 'refs/tags/v')
    needs: test
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        platform:
          - aarch64-linux
          - x86_64-linux
          - arm64-darwin
          - x86_64-darwin
    steps:
      - uses: actions/checkout@v5
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.4"
      - uses: oxidize-rb/actions/cross-gem@v1
        id: cross-gem
        with:
          platform: ${{ matrix.platform }}
          ruby-versions: "3.2,3.3,3.4"
      - uses: actions/upload-artifact@v7
        with:
          name: gem-${{ matrix.platform }}
          path: ${{ steps.cross-gem.outputs.gem-path }}
          if-no-files-found: error

  build-source-gem:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.4"
      - run: gem build prql-rb.gemspec
      - uses: actions/upload-artifact@v7
        with:
          name: gem-ruby
          path: prql-rb-*.gem

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [ build-gems, build-source-gem ]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v8
        with:
          path: pkg
          merge-multiple: true
      - name: Attach gems to release
        uses: softprops/action-gh-release@v2
        with:
          files: pkg/*.gem

  publish:
    # Push the cross-compiled platform gems to RubyGems.org via trusted
    # publishing (OIDC): no API key, short-lived tokens scoped to this
    # gem. The source (ruby platform) gem is pushed by `rake release`;
    # the prebuilt platform gems from the build jobs are pushed
    # directly. Already-published versions are skipped so re-tagging a
    # release is safe.
    if: startsWith(github.ref, 'refs/tags/v')
    needs: release
    runs-on: ubuntu-latest
    environment: rubygems
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.4"
          bundler-cache: true
      - uses: actions/download-artifact@v8
        with:
          path: pkg
          merge-multiple: true
      - uses: rubygems/configure-rubygems-credentials@dc5a8d8553e6ee01fc26761a49e99e733d17954a # v2.1.0
      - name: Push gems to RubyGems.org
        env:
          GEM_HOST_API_KEY: ${{ env.GEM_HOST_API_KEY }}
        run: |
          shopt -s extglob
          for gem in pkg/*.gem; do
            # Canonical filename: name-version-platform.gem, where the
            # name itself may contain hyphens (e.g. prql-rb-0.1.0.gem,
            # prql-rb-0.1.0-aarch64-linux.gem). The version is the first
            # dash-separated field that is purely numeric+dotted.
            base="$(basename "$gem" .gem)"
            name=""; version=""; platform=""
            seen_version=false
            IFS='-' read -ra parts <<< "$base"
            for part in "${parts[@]}"; do
              if ! $seen_version && [[ "$part" =~ ^[0-9][0-9.]*$ ]]; then
                version="$part"; seen_version=true
              elif ! $seen_version; then
                name="${name:+$name-}$part"
              else
                platform="${platform:+$platform-}$part"
              fi
            done
            [ -n "$platform" ] || platform="ruby"
            if gem list --remote --all --exact "$name" 2>/dev/null \
                 | grep -q "$version $platform"; then
              echo "Skipping $name $version $platform (already published)"
              continue
            fi
            gem push "$gem"
          done
      - name: Wait for release to propagate
        run: gem install rubygems-await --no-document && gem exec rubygems-await pkg/*.gem